name: Deploy Prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to publish"
        required: false
        default: "prod"
        type: string
      compose_ref:
        description: "App/Compose Git ref (blank uses workflow branch)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: loud-bot-prod-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy prod bot
    runs-on: [self-hosted, pi]
    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_TAG_INPUT}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::image_tag is not a valid container image tag"
            exit 1
          fi

      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.compose_ref || github.ref_name }}

      - name: Resolve immutable release
        id: release
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}-prod"
          commit="$(git rev-parse HEAD)"
          release_tag="${commit}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "repository=ghcr.io/${repository}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "requested_tag=${IMAGE_TAG_INPUT}" >> "${GITHUB_OUTPUT}"

      - name: Validate runner-local environment
        run: |
          set -euo pipefail
          deploy_dir="${HOME}/deploy/loud-bot-prod"
          env_file="${deploy_dir}/.env"
          mkdir -p "${deploy_dir}"
          if [[ ! -f "${env_file}" ]]; then
            echo "::error::Runner-local prod .env must define a non-empty DISCORD_TOKEN."
            exit 1
          fi
          install -m 0644 "${GITHUB_WORKSPACE}/docker-compose.yaml" "${deploy_dir}/docker-compose.yaml"
          if ! env -u DISCORD_TOKEN LOUD_BOT_IMAGE="loud-bot-env-check:local" docker compose \
            --project-name loud-bot-prod \
            --env-file "${env_file}" \
            --file "${deploy_dir}/docker-compose.yaml" \
            config --quiet >/dev/null 2>&1; then
            echo "::error::Runner-local prod .env must define a non-empty DISCORD_TOKEN."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.repository }}:${{ steps.release.outputs.requested_tag }}
            ${{ steps.release.outputs.repository }}:${{ steps.release.outputs.release_tag }}


      - name: Pull immutable image
        env:
          LOUD_BOT_IMAGE: ${{ steps.release.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          deploy_dir="${HOME}/deploy/loud-bot-prod"
          env -u DISCORD_TOKEN docker compose --project-name loud-bot-prod --env-file "${deploy_dir}/.env" --file "${deploy_dir}/docker-compose.yaml" pull

      - name: Start prod bot
        env:
          LOUD_BOT_IMAGE: ${{ steps.release.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          deploy_dir="${HOME}/deploy/loud-bot-prod"
          env -u DISCORD_TOKEN docker compose --project-name loud-bot-prod --env-file "${deploy_dir}/.env" --file "${deploy_dir}/docker-compose.yaml" up -d --wait --wait-timeout 90 --remove-orphans

      - name: Show deployment status
        env:
          LOUD_BOT_IMAGE: ${{ steps.release.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          deploy_dir="${HOME}/deploy/loud-bot-prod"
          env -u DISCORD_TOKEN docker compose --project-name loud-bot-prod --env-file "${deploy_dir}/.env" --file "${deploy_dir}/docker-compose.yaml" ps
